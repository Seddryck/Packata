{% for version in site.data.changelog %}
<section class="changelog-entry">
  <h2>{{ version.title | escape }}</h2>
  <p class="text-grey-dk-000">{{ version.date | escape }}{% if version.label %} · {{ version.label | escape }}{% endif %}</p>
  <ul>{% for item in version.list %}<li>{{ item | escape }}</li>{% endfor %}</ul>
</section>
{% endfor %}
