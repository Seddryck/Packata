title: Packata
description: Data packages and data contracts for .NET.
lang: en
url: "https://seddryck.github.io"
baseurl: "/Packata"
theme: just-the-docs
color_scheme: packata
logo: "/uploads/packata-icon-64.png"
favicon_ico: "/uploads/favicon.ico"
permalink: /:title/

search_enabled: true
search:
  heading_level: 3
  previews: 2
  rel_url: true
  focus_shortcut_key: k
heading_anchors: true
enable_copy_code_button: true
nav_sort: order
aux_links:
  Issue tracking:
    - https://github.com/Seddryck/Packata/issues
  View on GitHub:
    - https://github.com/Seddryck/Packata
back_to_top: true
back_to_top_text: Back to top
footer_content: 'Packata · Data packages and data contracts for .NET · <a href="https://github.com/Seddryck/Packata/blob/main/LICENSE">Apache 2.0</a>'

defaults:
  - scope:
      path: ""
    values:
      layout: page
      nav_exclude: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed
  quiet_deps: true
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
