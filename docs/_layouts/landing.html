<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  {% seo title=false %}
  <link rel="icon" href="{{ '/uploads/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">
  <script src="{{ '/assets/js/landing.js' | relative_url }}" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-workflow" viewBox="0 0 32 32"><path d="M10 8h12M8 12v10m16-10v10M10 25h12M11 10l10 12"/><circle cx="7" cy="7" r="4"/><circle cx="25" cy="7" r="4"/><circle cx="7" cy="25" r="4"/><circle cx="25" cy="25" r="4"/></symbol>
    <symbol id="icon-terminal" viewBox="0 0 32 32"><path d="m7 8 9 8-9 8m11 0h8"/></symbol>
    <symbol id="icon-code" viewBox="0 0 32 32"><path d="m10 6-8 10 8 10m12-20 8 10-8 10M19 3l-6 26"/></symbol>
    <symbol id="icon-preview" viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="22" rx="3"/><path d="m8 10 4 3-4 3m8 1h6M11 30h10m-5-4v4"/></symbol>
    <symbol id="icon-package" viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="23" rx="2"/><path d="M5 10h22M8 6V2h16v4"/></symbol>
    <symbol id="icon-contract" viewBox="0 0 32 32"><path d="M7 2h13l6 6v20a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm13 0v7h6M10 14h11m-11 5h3m4 0h4m-11 5h11"/></symbol>
    <symbol id="icon-csv" viewBox="0 0 32 32"><path d="M7 2h13l6 6v20a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm13 0v7h6"/><path d="M11 15H8v7h3m3-7h3v3h-3v4h3m3-7 2 7 2-7" stroke-width="1.5"/></symbol>
    <symbol id="icon-parquet" viewBox="0 0 32 32"><path d="m2 12 14-9 14 9-14 17Zm0 0 14 8 14-8M9 8l14 8M5 10l14 8m-3-15 10 12M11 6l11 12M16 20v9M9 16v5m14-5v5"/></symbol>
    <symbol id="icon-records" viewBox="0 0 32 32"><path d="M4 4h24v24H4ZM4 12h24M4 20h24M12 4v24M20 4v24"/></symbol>
    <symbol id="icon-github" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 .8a11.3 11.3 0 0 0-3.6 22c.6.1.8-.2.8-.5v-2.1c-3.4.7-4.1-1.4-4.1-1.4-.5-1.3-1.3-1.6-1.3-1.6-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6a4.7 4.7 0 0 1 1.2-3.2 4.3 4.3 0 0 1 .1-3.2s1-.3 3.3 1.2a11.3 11.3 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.8.3 3.1.1 3.2a4.7 4.7 0 0 1 1.2 3.2c0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.2c0 .3.2.6.8.5A11.3 11.3 0 0 0 12 .8Z"/></symbol>
  </defs></svg>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="container navigation" aria-label="Main navigation">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Packata home"><span aria-hidden="true"></span>packata.</a>
      <div class="nav-links">
        <a href="#workflow-title">Overview</a>
        <a href="{{ '/getting-started/' | relative_url }}">Documentation</a>
        <a class="github-link" href="https://github.com/Seddryck/Packata">GitHub <svg class="icon" aria-hidden="true"><use href="#icon-github"/></svg></a>
      </div>
    </nav>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="container footer">
    <a class="footer-brand" href="https://github.com/Seddryck/Packata">Packata · Open source, Apache 2.0</a>
    <div><a href="{{ '/contact/' | relative_url }}">Contact</a><a href="https://github.com/Seddryck/Packata/discussions">Join the discussion <span aria-hidden="true">↗</span></a></div>
  </footer>
</body>
</html>
