name: CI and release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1

jobs:
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      patch: ${{ steps.gitversion.outputs.patch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.6.0

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ steps.gitversion.outputs.semVer }}'
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "GitVersion produced invalid SemVer '$version'."
          }

  build-test-package:
    name: Build, test, and package
    needs: version
    runs-on: windows-latest
    outputs:
      has-release-asset: ${{ steps.schema.outputs.has-release-asset }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401

      - name: Restore
        run: dotnet restore Packata.sln

      - name: Build
        run: >-
          dotnet build Packata.sln
          --configuration Release
          --no-restore
          --nologo
          -p:Version=${{ needs.version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Test supported frameworks
        shell: pwsh
        run: |
          $projects = @(
            'Packata.Core',
            'Packata.DataPackage',
            'Packata.ResourceReaders',
            'Packata.Provisioners',
            'Packata.Storages',
            'Packata.OpenDataContract'
          )
          $frameworks = @('net8.0', 'net9.0', 'net10.0')
          $thresholdProjects = @('Packata.Core', 'Packata.ResourceReaders', 'Packata.Provisioners')

          New-Item -ItemType Directory -Force .coverage, .test-results | Out-Null

          foreach ($project in $projects) {
            foreach ($framework in $frameworks) {
              $testProject = "src/$project.Testing/$project.Testing.csproj"
              $coverage = "$pwd/.coverage/coverage.$project.$framework.xml"
              $results = "$pwd/.test-results/$project/$framework"
              $arguments = @(
                'test', $testProject,
                '--configuration', 'Release',
                '--framework', $framework,
                '--no-build',
                '--no-restore',
                '--nologo',
                '--logger', 'trx',
                '--results-directory', $results,
                '-p:CollectCoverage=true',
                '-p:CoverletOutputFormat=opencover',
                '-p:Exclude=[Packata.*.Testing]*',
                "-p:CoverletOutput=$coverage"
              )

              if ($project -in $thresholdProjects) {
                $arguments += '-p:Threshold=10', '-p:ThresholdType=line'
              }

              & dotnet @arguments
              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed for $project on $framework."
              }
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ needs.version.outputs.semver }}
          path: .test-results
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: .coverage
          fail_ci_if_error: true
          use_oidc: true

      - name: Install schema generator
        run: dotnet tool install --global Schemathief-cli --version 0.3.0

      - name: Generate schema release asset
        id: schema
        shell: pwsh
        run: |
          ./package-delta-schemas.ps1 -Version '${{ needs.version.outputs.semver }}' -OutputDirectory './.artifacts/release'
          $archive = Test-Path -LiteralPath './.artifacts/release/schemas-${{ needs.version.outputs.semver }}.zip' -PathType Leaf
          "has-release-asset=$($archive.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $projects = @(
            'Packata.Core',
            'Packata.DataPackage',
            'Packata.ResourceReaders',
            'Packata.Provisioners',
            'Packata.Storages',
            'Packata.OpenDataContract'
          )

          foreach ($project in $projects) {
            dotnet pack "src/$project/$project.csproj" `
              --configuration Release `
              --no-build `
              --no-restore `
              --nologo `
              --include-symbols `
              --output .artifacts/nuget `
              -p:Version='${{ needs.version.outputs.semver }}'

            if ($LASTEXITCODE -ne 0) {
              throw "Packing failed for $project."
            }
          }

      - name: Validate release artifacts
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-ReleaseArtifacts.ps1
          -Version '${{ needs.version.outputs.semver }}'
          -NuGetDirectory './.artifacts/nuget'
          -ReleaseDirectory './.artifacts/release'

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ needs.version.outputs.semver }}
          path: .artifacts/nuget
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload release assets
        if: steps.schema.outputs.has-release-asset == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.version.outputs.semver }}
          path: .artifacts/release
          include-hidden-files: true
          if-no-files-found: error

  test-cli:
    name: Test Packata CLI
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore CLI tests
        run: dotnet restore src/Packata.Cli.Testing/Packata.Cli.Testing.csproj

      - name: Build CLI tests
        run: >-
          dotnet build src/Packata.Cli.Testing/Packata.Cli.Testing.csproj
          --configuration Release
          --no-restore
          --nologo
          -p:Version=${{ needs.version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Run CLI tests
        run: >-
          dotnet test src/Packata.Cli.Testing/Packata.Cli.Testing.csproj
          --configuration Release
          --no-build
          --no-restore
          --nologo

  package-cli-tool:
    name: Package Packata CLI tool
    needs:
      - version
      - test-cli
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore CLI tool
        run: dotnet restore src/Packata.Cli/Packata.Cli.csproj

      - name: Pack CLI tool
        run: >-
          dotnet pack src/Packata.Cli/Packata.Cli.csproj
          --configuration Release
          --no-restore
          --nologo
          --output .artifacts/cli-nuget
          -p:Version=${{ needs.version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Validate CLI tool package
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.version.outputs.semver }}'
          -NuGetDirectory './.artifacts/cli-nuget'
          -SkipReleaseArchives

      - name: Upload CLI tool package
        uses: actions/upload-artifact@v7
        with:
          name: cli-tool-${{ needs.version.outputs.semver }}
          path: .artifacts/cli-nuget
          if-no-files-found: error

  package-cli-runtimes:
    name: Package CLI (${{ matrix.rid }})
    needs:
      - version
      - test-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            archive: zip
            executable: packata.exe
          - rid: win-arm64
            runner: windows-11-arm
            archive: zip
            executable: packata.exe
          - rid: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: linux-musl-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: osx-x64
            runner: macos-15-intel
            archive: tar.gz
            executable: packata
          - rid: osx-arm64
            runner: macos-15
            archive: tar.gz
            executable: packata
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore CLI runtime
        run: dotnet restore src/Packata.Cli/Packata.Cli.csproj --runtime ${{ matrix.rid }}

      - name: Publish self-contained CLI
        run: >-
          dotnet publish src/Packata.Cli/Packata.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --nologo
          --output .artifacts/cli-publish/${{ matrix.rid }}
          -p:Version=${{ needs.version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:PublishAot=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create runtime archive
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.version.outputs.semver }}'
          $publishDirectory = Resolve-Path ".artifacts/cli-publish/$rid"
          $stageDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-stage/$rid"
          $releaseDirectory = New-Item -ItemType Directory -Force '.artifacts/cli-release'

          Copy-Item (Join-Path $publishDirectory '${{ matrix.executable }}') $stageDirectory
          Copy-Item './LICENSE' $stageDirectory
          Copy-Item './README.md' $stageDirectory

          if ('${{ matrix.archive }}' -eq 'zip') {
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$rid.zip"
            Compress-Archive -Path (Join-Path $stageDirectory '*') -DestinationPath $archive -CompressionLevel Optimal
          }
          else {
            $executable = Join-Path $stageDirectory 'packata'
            & chmod +x $executable
            if ($LASTEXITCODE -ne 0) { throw "Could not mark '$executable' as executable." }
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$rid.tar.gz"
            & tar -czf $archive -C $stageDirectory 'packata' 'LICENSE' 'README.md'
            if ($LASTEXITCODE -ne 0) { throw "Could not create '$archive'." }
          }

      - name: Smoke-test archived CLI
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.version.outputs.semver }}'
          $verifyDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-verify/$rid"
          $extension = '${{ matrix.archive }}'
          $archive = ".artifacts/cli-release/Packata-cli-$version-$rid.$extension"

          if ($extension -eq 'zip') {
            Expand-Archive -LiteralPath $archive -DestinationPath $verifyDirectory
          }
          else {
            & tar -xzf $archive -C $verifyDirectory
            if ($LASTEXITCODE -ne 0) { throw "Could not extract '$archive'." }
          }

          if ($rid.StartsWith('linux-musl-')) {
            $mount = "$((Resolve-Path $verifyDirectory).Path):/work"
            $help = @(& docker run --rm --volume $mount --workdir /work alpine:3.22 ./packata --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$rid'." }
            $reportedVersion = @(& docker run --rm --volume $mount --workdir /work alpine:3.22 ./packata --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$rid'." }
          }
          else {
            $executable = Join-Path $verifyDirectory '${{ matrix.executable }}'
            $help = @(& $executable --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$rid'." }
            $reportedVersion = @(& $executable --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$rid'." }
          }

          if (($help -join "`n") -notmatch 'USAGE') {
            throw "Packata CLI help output for '$rid' did not contain a usage section."
          }
          if (($reportedVersion -join "`n") -notmatch [regex]::Escape($version)) {
            $actualVersion = $reportedVersion -join ' '
            throw "Packata CLI for '$rid' reported '$actualVersion' instead of '$version'."
          }

      - name: Validate runtime archive
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.version.outputs.semver }}'
          -ReleaseDirectory './.artifacts/cli-release'
          -ExpectedRids @('${{ matrix.rid }}')
          -SkipNuGetPackage

      - name: Upload runtime archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-runtime-${{ matrix.rid }}-${{ needs.version.outputs.semver }}
          path: .artifacts/cli-release
          if-no-files-found: error

  validate-cli-artifacts:
    name: Validate complete CLI release
    needs:
      - version
      - package-cli-tool
      - package-cli-runtimes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download CLI tool package
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.version.outputs.semver }}
          path: .artifacts/cli-nuget

      - name: Download CLI runtime archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-runtime-*-${{ needs.version.outputs.semver }}
          path: .artifacts/cli-release
          merge-multiple: true

      - name: Validate CLI release set
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.version.outputs.semver }}'
          -NuGetDirectory './.artifacts/cli-nuget'
          -ReleaseDirectory './.artifacts/cli-release'

  publish:
    name: Publish tested artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - version
      - build-test-package
      - package-cli-tool
      - package-cli-runtimes
      - validate-cli-artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Download NuGet packages
        uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.version.outputs.semver }}
          path: .artifacts/nuget/libraries

      - name: Download CLI tool package
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.version.outputs.semver }}
          path: .artifacts/nuget/cli

      - name: Download release assets
        if: needs.build-test-package.outputs.has-release-asset == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.version.outputs.semver }}
          path: .artifacts/release

      - name: Download CLI runtime archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-runtime-*-${{ needs.version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Revalidate downloaded artifacts and commit
        shell: pwsh
        run: |
          $testedCommit = git rev-parse HEAD
          if ($testedCommit -ne '${{ github.sha }}') {
            throw "Checked-out commit '$testedCommit' does not match tested commit '${{ github.sha }}'."
          }

          ./.github/scripts/Validate-ReleaseArtifacts.ps1 `
            -Version '${{ needs.version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/libraries' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-CliArtifacts.ps1 `
            -Version '${{ needs.version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/cli' `
            -ReleaseDirectory './.artifacts/release'

      - name: Reserve release tag
        if: needs.version.outputs.patch == '0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ needs.version.outputs.semver }}'
          git fetch origin --force --tags
          $remote = git ls-remote --tags origin "refs/tags/$tag"

          if ($remote) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne '${{ github.sha }}') {
              throw "Tag '$tag' already identifies '$tagCommit', not '${{ github.sha }}'."
            }
            Write-Host "Reusing '$tag' for the tested commit."
          }
          else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate $tag --message "Packata ${{ needs.version.outputs.semver }}" '${{ github.sha }}'
            git push origin $tag
          }

      - name: Exchange GitHub identity for a NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Seddryck

      - name: Publish NuGet packages
        shell: pwsh
        run: |
          Get-ChildItem .artifacts/nuget -Filter *.nupkg -File -Recurse | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              throw "Publishing '$($_.Name)' failed."
            }
          }

      - name: Create or update GitHub release
        if: needs.version.outputs.patch == '0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ needs.version.outputs.semver }}'
          $assets = @(Get-ChildItem '.artifacts/release' -File | Select-Object -ExpandProperty FullName)

          if (gh release view $tag 2>$null) {
            if ($assets.Count -gt 0) {
              gh release upload $tag @assets --clobber
            }
          }
          else {
            $arguments = @(
              'release', 'create', $tag,
              '--title', 'Packata ${{ needs.version.outputs.semver }}',
              '--generate-notes',
              '--discussion-category', 'Announcements',
              '--verify-tag'
            )
            if ($assets.Count -gt 0) {
              $arguments += $assets
            }
            gh @arguments
          }
