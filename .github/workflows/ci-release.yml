name: Build, package, and publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1

jobs:
  calculate-version:
    name: Version · calculate and validate
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      patch: ${{ steps.gitversion.outputs.patch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.6.0

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Validate version
        id: version
        shell: pwsh
        run: |
          # Older Linux SDKs derive a lowercase package path but preserve the
          # nuspec's prerelease casing when staging it. Canonicalize before building.
          $version = '${{ steps.gitversion.outputs.semVer }}'.ToLowerInvariant()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "GitVersion produced invalid SemVer '$version'."
          }
          "semver=$version" >> $env:GITHUB_OUTPUT

  build-package-language-support:
    name: Language support · ${{ matrix.target }}
    needs: calculate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Test language-server services and stdio protocol
        run: dotnet test src/Packata.LanguageServer.Testing/Packata.LanguageServer.Testing.csproj --configuration Release --framework net10.0 --nologo
      - name: Test shared application workflows
        run: dotnet test src/Packata.Application.Testing/Packata.Application.Testing.csproj --configuration Release --framework net10.0 --nologo
      - name: Restore extension dependencies
        working-directory: vscode-extension
        run: npm ci --ignore-scripts
      - name: Test client and tree behavior
        working-directory: vscode-extension
        run: npm test
      - name: Package and validate self-contained VSIX
        working-directory: vscode-extension
        env:
          PACKATA_VERSION: ${{ needs.calculate-version.outputs.semver }}
        run: npm run package -- --target ${{ matrix.target }}
      - name: Install Linux test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Smoke-test VS Code host on Linux
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:host
      - name: Smoke-test VS Code host
        if: runner.os != 'Linux'
        working-directory: vscode-extension
        run: npm run test:host
      - name: Upload validated extension
        uses: actions/upload-artifact@v7
        with:
          name: vscode-${{ matrix.target }}-${{ needs.calculate-version.outputs.semver }}
          path: vscode-extension/artifacts/*.vsix
          if-no-files-found: error

  test-http-interoperability:
    name: HTTP streaming - Python clients (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install independent stream decoders
        run: >-
          python -m pip install --only-binary :all:
          pyarrow==26.0.0 fastavro==1.13.1 tzdata==2026.6
      - name: Verify incremental live HTTP clients and completion
        shell: pwsh
        run: |
          $env:PACKATA_INTEROP_PYTHON = (Get-Command python).Source
          dotnet test src/Packata.Http.Testing/Packata.Http.Testing.csproj --configuration Release --framework net10.0 --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Live HTTP interoperability failed.' }

  build-test-libraries:
    name: Libraries · build and test
    needs: [calculate-version, test-http-interoperability]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.427
            9.0.320
            10.0.403

      - name: Restore libraries
        run: dotnet restore Packata.Libraries.slnf

      - name: Build libraries
        run: >-
          dotnet build Packata.Libraries.slnf
          --configuration Release
          --no-restore
          --nologo
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Test supported frameworks
        shell: pwsh
        run: |
          $projects = @(
            'Packata.Arrow',
            'Packata.Http',
            'Packata.Core',
            'Packata.DataPackage',
            'Packata.ResourceReaders',
            'Packata.Provisioners',
            'Packata.Storages',
            'Packata.OpenDataContract',
            'Packata.Rules.Expressif',
            'Packata.Rules.Sql'
          )
          $frameworks = @('net8.0', 'net9.0', 'net10.0')
          $thresholdProjects = @('Packata.Core', 'Packata.ResourceReaders', 'Packata.Provisioners')

          New-Item -ItemType Directory -Force .coverage, .test-results | Out-Null

          foreach ($project in $projects) {
            foreach ($framework in $frameworks) {
              $testProject = "src/$project.Testing/$project.Testing.csproj"
              $coverage = "$pwd/.coverage/coverage.$project.$framework.xml"
              $results = "$pwd/.test-results/$project/$framework"
              $arguments = @(
                'test', $testProject,
                '--configuration', 'Release',
                '--framework', $framework,
                '--no-build',
                '--no-restore',
                '--nologo',
                '--logger', 'trx',
                '--results-directory', $results,
                '-p:CollectCoverage=true',
                '-p:CoverletOutputFormat=opencover',
                '-p:Exclude=[Packata.*.Testing]*',
                "-p:CoverletOutput=$coverage"
              )

              if ($project -in $thresholdProjects) {
                # Gate total coverage for this test run, not each referenced plug-in assembly.
                $arguments += '-p:Threshold=10', '-p:ThresholdType=line', '-p:ThresholdStat=total'
              }

              & dotnet @arguments
              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed for $project on $framework."
              }
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ needs.calculate-version.outputs.semver }}
          path: .test-results
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: .coverage
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload compiled library outputs for packaging
        uses: actions/upload-artifact@v7
        with:
          name: library-build-${{ needs.calculate-version.outputs.semver }}
          path: |
            src/Packata.Arrow/bin/Release
            src/Packata.Arrow/obj
            src/Packata.Http/bin/Release
            src/Packata.Http/obj
            src/Packata.Http.Arrow/bin/Release
            src/Packata.Http.Arrow/obj
            src/Packata.Core/bin/Release
            src/Packata.Core/obj
            src/Packata.Database/bin/Release
            src/Packata.Database/obj
            src/Packata.DataPackage/bin/Release
            src/Packata.DataPackage/obj
            src/Packata.OpenDataContract/bin/Release
            src/Packata.OpenDataContract/obj
            src/Packata.Rules.Expressif/bin/Release
            src/Packata.Rules.Expressif/obj
            src/Packata.Rules.Sql/bin/Release
            src/Packata.Rules.Sql/obj
            src/Packata.Provisioners/bin/Release
            src/Packata.Provisioners/obj
            src/Packata.ResourceReaders/bin/Release
            src/Packata.ResourceReaders/obj
            src/Packata.ResourceReaders.Database/bin/Release
            src/Packata.ResourceReaders.Database/obj
            src/Packata.ResourceReaders.Excel/bin/Release
            src/Packata.ResourceReaders.Excel/obj
            src/Packata.ResourceReaders.FixedWidth/bin/Release
            src/Packata.ResourceReaders.FixedWidth/obj
            src/Packata.ResourceReaders.KeyValue/bin/Release
            src/Packata.ResourceReaders.KeyValue/obj
            src/Packata.ResourceReaders.Ndjson/bin/Release
            src/Packata.ResourceReaders.Ndjson/obj
            src/Packata.ResourceReaders.Parquet/bin/Release
            src/Packata.ResourceReaders.Parquet/obj
            src/Packata.ResourceReaders.WebLogs/bin/Release
            src/Packata.ResourceReaders.WebLogs/obj
            src/Packata.Storages/bin/Release
            src/Packata.Storages/obj
          if-no-files-found: error

  package-libraries:
    name: Libraries · package NuGet and schema artifacts
    needs:
      - calculate-version
      - build-test-libraries
    runs-on: windows-latest
    outputs:
      has-release-asset: ${{ steps.schema.outputs.has-release-asset }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore library package dependencies
        run: dotnet restore Packata.Libraries.slnf

      - name: Download compiled library outputs
        uses: actions/download-artifact@v7
        with:
          name: library-build-${{ needs.calculate-version.outputs.semver }}
          path: src

      - name: Install schema generator
        # Schemathief 0.3.0 targets net8.0/net9.0; use the .NET 10 runtime bundled with the SDK.
        run: dotnet tool install --global Schemathief-cli --version 0.3.0 --allow-roll-forward

      - name: Generate schema release asset
        id: schema
        shell: pwsh
        run: |
          ./package-delta-schemas.ps1 -Version '${{ needs.calculate-version.outputs.semver }}' -OutputDirectory './.artifacts/release'
          $archive = Test-Path -LiteralPath './.artifacts/release/schemas-${{ needs.calculate-version.outputs.semver }}.zip' -PathType Leaf
          "has-release-asset=$($archive.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Package library NuGet artifacts
        shell: pwsh
        run: |
          $projects = @(
            'Packata.Arrow',
            'Packata.Http',
            'Packata.Http.Arrow',
            'Packata.Core',
            'Packata.Database',
            'Packata.DataPackage',
            'Packata.ResourceReaders',
            'Packata.ResourceReaders.Database',
            'Packata.ResourceReaders.Excel',
            'Packata.ResourceReaders.FixedWidth',
            'Packata.ResourceReaders.KeyValue',
            'Packata.ResourceReaders.Ndjson',
            'Packata.ResourceReaders.Parquet',
            'Packata.ResourceReaders.WebLogs',
            'Packata.Provisioners',
            'Packata.Storages',
            'Packata.OpenDataContract',
            'Packata.Rules.Expressif',
            'Packata.Rules.Sql'
          )

          foreach ($project in $projects) {
            dotnet pack "src/$project/$project.csproj" `
              --configuration Release `
              --no-build `
              --no-restore `
              --nologo `
              --include-symbols `
              --output .artifacts/nuget `
              -p:Version='${{ needs.calculate-version.outputs.semver }}'

            if ($LASTEXITCODE -ne 0) {
              throw "Packing failed for $project."
            }
          }

      - name: Validate release artifacts
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-ReleaseArtifacts.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -NuGetDirectory './.artifacts/nuget'
          -ReleaseDirectory './.artifacts/release'

      - name: Upload packaged library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload packaged schema artifact
        if: steps.schema.outputs.has-release-asset == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          include-hidden-files: true
          if-no-files-found: error

  build-test-cli:
    name: CLI · build and test (${{ matrix.framework }})
    needs: calculate-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.427
            9.0.320
            10.0.403

      - name: Restore CLI tests
        run: >-
          dotnet restore src/Packata.Cli.Testing/Packata.Cli.Testing.csproj
          -p:TargetFrameworks=${{ matrix.framework }}

      - name: Build CLI tests
        run: >-
          dotnet build src/Packata.Cli.Testing/Packata.Cli.Testing.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-restore
          --nologo
          -p:TargetFrameworks=${{ matrix.framework }}
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Run CLI tests
        run: >-
          dotnet test src/Packata.Cli.Testing/Packata.Cli.Testing.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-build
          --no-restore
          --nologo
          -p:TargetFrameworks=${{ matrix.framework }}

  package-cli-nuget:
    name: CLI · package NuGet tool
    needs:
      - calculate-version
      - package-cli-framework-archives
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Download tested framework-dependent archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-framework-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-framework-archives
          merge-multiple: true

      - name: Extract immutable CLI package inputs
        shell: pwsh
        run: >-
          ./.github/scripts/Expand-CliFrameworkArchives.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -ArchiveDirectory './.artifacts/cli-framework-archives'
          -OutputDirectory './.artifacts/cli-publish'

      - name: Restore packaging metadata
        run: dotnet restore .github/packaging/Packata.Cli.Package.csproj

      - name: Package CLI pointer and RID-specific tools
        run: >-
          dotnet pack .github/packaging/Packata.Cli.Package.csproj
          --configuration Release
          --no-build
          --no-restore
          --nologo
          --output .artifacts/cli-nuget
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:CliPublishRoot=${{ github.workspace }}/.artifacts/cli-publish
          -p:ContinuousIntegrationBuild=true

      - name: Validate CLI tool package
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -NuGetDirectory './.artifacts/cli-nuget'
          -FrameworkPayloadDirectory './.artifacts/cli-publish'
          -SkipFrameworkDependentArchives
          -SkipSelfContainedArchives

      - name: Upload CLI tool package
        uses: actions/upload-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-nuget
          if-no-files-found: error

  test-cli-nuget:
    name: CLI · install NuGet tool (${{ matrix.target.rid }})
    needs:
      - calculate-version
      - package-cli-nuget
    strategy:
      fail-fast: false
      matrix:
        target:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: linux-musl-x64
            runner: ubuntu-latest
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.target.runner }}
    env:
      CLI_TEST_CONTAINER: ${{ startsWith(matrix.target.rid, 'linux-musl-') && 'packata-cli-tool-smoke' || '' }}
      CLI_TEST_WORK: ${{ startsWith(matrix.target.rid, 'linux-musl-') && '/tmp/tool-install' || './.artifacts/tool-install' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs and runtimes
        if: ${{ !startsWith(matrix.target.rid, 'linux-musl-') }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.427
            9.0.320
            10.0.403

      - name: Download candidate CLI packages
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-nuget

      - name: Prepare installation environment
        id: installation
        shell: pwsh
        run: |
          if ('${{ matrix.target.rid }}'.StartsWith('linux-musl-')) {
            docker build --file .github/packaging/AlpineToolSmoke.Dockerfile `
              --tag packata-cli-tool-smoke .github/packaging
            if ($LASTEXITCODE -ne 0) { throw 'Could not build the pinned Alpine test environment.' }
          }

      # Share the SDK setup and package download per RID, but keep every framework
      # explicit and independently isolated. Continue later checks after a failure.
      - name: Install and execute net8.0 NuGet tool
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        shell: pwsh
        run: >-
          ./.github/scripts/Test-CliToolInstallation.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -NuGetDirectory './.artifacts/cli-nuget'
          -SdkVersion '10.0.403'
          -Framework 'net8.0'
          -WorkingDirectory "$env:CLI_TEST_WORK/net8.0"
          -ContainerImage $env:CLI_TEST_CONTAINER

      - name: Install and execute net9.0 NuGet tool
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        shell: pwsh
        run: >-
          ./.github/scripts/Test-CliToolInstallation.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -NuGetDirectory './.artifacts/cli-nuget'
          -SdkVersion '10.0.403'
          -Framework 'net9.0'
          -WorkingDirectory "$env:CLI_TEST_WORK/net9.0"
          -ContainerImage $env:CLI_TEST_CONTAINER

      - name: Install and execute net10.0 NuGet tool
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        shell: pwsh
        run: >-
          ./.github/scripts/Test-CliToolInstallation.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -NuGetDirectory './.artifacts/cli-nuget'
          -SdkVersion '10.0.403'
          -Framework 'net10.0'
          -WorkingDirectory "$env:CLI_TEST_WORK/net10.0"
          -ContainerImage $env:CLI_TEST_CONTAINER

  test-cli-sdk-compatibility:
    name: CLI · verify SDK ${{ matrix.sdk }} installation compatibility (${{ matrix.runner }})
    needs:
      - calculate-version
      - package-cli-nuget
    strategy:
      fail-fast: false
      matrix:
        sdk: [8.0.427, 9.0.320]
        runner: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up the SDK under test
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Download candidate CLI packages
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-nuget

      - name: Verify older SDK rejection of the RID-aware pointer
        shell: pwsh
        run: >-
          ./.github/scripts/Test-CliToolInstallation.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -NuGetDirectory './.artifacts/cli-nuget'
          -SdkVersion '${{ matrix.sdk }}'
          -Framework 'net${{ startsWith(matrix.sdk, '8.') && '8' || '9' }}.0'
          -WorkingDirectory './.artifacts/tool-install'
          -ExpectUnsupportedSdk

  package-cli-framework-archives:
    name: CLI · package framework archive (${{ matrix.framework.tfm }}, ${{ matrix.target.rid }})
    needs:
      - calculate-version
      - build-test-cli
    strategy:
      fail-fast: false
      matrix:
        framework:
          - tfm: net8.0
            runtime: '8.0'
          - tfm: net9.0
            runtime: '9.0'
          - tfm: net10.0
            runtime: '10.0'
        target:
          - rid: win-x64
            runner: windows-latest
            archive: zip
            executable: packata.exe
          - rid: win-arm64
            runner: windows-11-arm
            archive: zip
            executable: packata.exe
          - rid: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: linux-musl-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: osx-x64
            runner: macos-15-intel
            archive: tar.gz
            executable: packata
          - rid: osx-arm64
            runner: macos-15
            archive: tar.gz
            executable: packata
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.427
            9.0.320
            10.0.403

      - name: Restore framework-dependent CLI runtime
        run: >-
          dotnet restore src/Packata.Cli/Packata.Cli.csproj
          --runtime ${{ matrix.target.rid }}
          -p:TargetFrameworks=${{ matrix.framework.tfm }}
          -p:SelfContained=false

      - name: Build framework-dependent CLI payload
        run: >-
          dotnet publish src/Packata.Cli/Packata.Cli.csproj
          --configuration Release
          --framework ${{ matrix.framework.tfm }}
          --runtime ${{ matrix.target.rid }}
          --self-contained false
          --no-restore
          --nologo
          --output .artifacts/cli-publish/${{ matrix.framework.tfm }}/${{ matrix.target.rid }}
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:PublishAot=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create framework-dependent archive
        shell: pwsh
        run: |
          $framework = '${{ matrix.framework.tfm }}'
          $rid = '${{ matrix.target.rid }}'
          $version = '${{ needs.calculate-version.outputs.semver }}'
          $publishDirectory = Resolve-Path ".artifacts/cli-publish/$framework/$rid"
          $stageDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-stage/$framework/$rid"
          $releaseDirectory = New-Item -ItemType Directory -Force '.artifacts/cli-release'

          Copy-Item (Join-Path $publishDirectory '*') $stageDirectory -Recurse
          Copy-Item './LICENSE' $stageDirectory
          Copy-Item './README.md' $stageDirectory

          if ('${{ matrix.target.archive }}' -eq 'zip') {
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$framework-$rid.zip"
            Compress-Archive -Path (Join-Path $stageDirectory '*') -DestinationPath $archive -CompressionLevel Optimal
          }
          else {
            $executable = Join-Path $stageDirectory 'packata'
            & chmod +x $executable
            if ($LASTEXITCODE -ne 0) { throw "Could not mark '$executable' as executable." }
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$framework-$rid.tar.gz"
            & tar -czf $archive -C $stageDirectory .
            if ($LASTEXITCODE -ne 0) { throw "Could not create '$archive'." }
          }

      - name: Smoke-test framework-dependent archive
        shell: pwsh
        run: |
          $framework = '${{ matrix.framework.tfm }}'
          $rid = '${{ matrix.target.rid }}'
          $version = '${{ needs.calculate-version.outputs.semver }}'
          $verifyDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-verify/$framework/$rid"
          $extension = '${{ matrix.target.archive }}'
          $archive = ".artifacts/cli-release/Packata-cli-$version-$framework-$rid.$extension"

          if ($extension -eq 'zip') {
            Expand-Archive -LiteralPath $archive -DestinationPath $verifyDirectory
          }
          else {
            & tar -xzf $archive -C $verifyDirectory
            if ($LASTEXITCODE -ne 0) { throw "Could not extract '$archive'." }
          }

          if ($rid.StartsWith('linux-musl-')) {
            $mount = "$((Resolve-Path $verifyDirectory).Path):/work"
            $image = 'mcr.microsoft.com/dotnet/aspnet:${{ matrix.framework.runtime }}-alpine'
            $help = @(& docker run --rm --volume $mount --workdir /work $image ./packata --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$framework/$rid': $($help -join ' ')" }
            $reportedVersion = @(& docker run --rm --volume $mount --workdir /work $image ./packata --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$framework/$rid': $($reportedVersion -join ' ')" }
          }
          else {
            $executable = Join-Path $verifyDirectory '${{ matrix.target.executable }}'
            $help = @(& $executable --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$framework/$rid'." }
            $reportedVersion = @(& $executable --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$framework/$rid'." }
          }

          if (($help -join "`n") -notmatch 'USAGE') {
            throw "Packata CLI help output for '$framework/$rid' did not contain a usage section."
          }
          if (($reportedVersion -join "`n") -notmatch [regex]::Escape($version)) {
            $actualVersion = $reportedVersion -join ' '
            throw "Packata CLI for '$framework/$rid' reported '$actualVersion' instead of '$version'."
          }

      - name: Validate framework-dependent archive
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -ReleaseDirectory './.artifacts/cli-release'
          -ExpectedFrameworks @('${{ matrix.framework.tfm }}')
          -ExpectedRids @('${{ matrix.target.rid }}')
          -SkipNuGetPackage
          -SkipSelfContainedArchives

      - name: Upload framework-dependent archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-framework-${{ matrix.framework.tfm }}-${{ matrix.target.rid }}-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-release
          if-no-files-found: error

  package-cli-self-contained-archives:
    name: CLI · package self-contained archive (net10.0, ${{ matrix.rid }})
    needs:
      - calculate-version
      - build-test-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            archive: zip
            executable: packata.exe
          - rid: win-arm64
            runner: windows-11-arm
            archive: zip
            executable: packata.exe
          - rid: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: linux-musl-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: osx-x64
            runner: macos-15-intel
            archive: tar.gz
            executable: packata
          - rid: osx-arm64
            runner: macos-15
            archive: tar.gz
            executable: packata
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore self-contained CLI runtime
        run: >-
          dotnet restore src/Packata.Cli/Packata.Cli.csproj
          --runtime ${{ matrix.rid }}
          -p:TargetFrameworks=net10.0
          -p:SelfContained=true

      - name: Build self-contained CLI payload
        run: >-
          dotnet publish src/Packata.Cli/Packata.Cli.csproj
          --configuration Release
          --framework net10.0
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --nologo
          --output .artifacts/cli-publish/${{ matrix.rid }}
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:PublishAot=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create self-contained archive
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.calculate-version.outputs.semver }}'
          $publishDirectory = Resolve-Path ".artifacts/cli-publish/$rid"
          $stageDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-stage/$rid"
          $releaseDirectory = New-Item -ItemType Directory -Force '.artifacts/cli-release'

          Copy-Item (Join-Path $publishDirectory '${{ matrix.executable }}') $stageDirectory
          Copy-Item './LICENSE' $stageDirectory
          Copy-Item './README.md' $stageDirectory

          if ('${{ matrix.archive }}' -eq 'zip') {
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$rid.zip"
            Compress-Archive -Path (Join-Path $stageDirectory '*') -DestinationPath $archive -CompressionLevel Optimal
          }
          else {
            $executable = Join-Path $stageDirectory 'packata'
            & chmod +x $executable
            if ($LASTEXITCODE -ne 0) { throw "Could not mark '$executable' as executable." }
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$rid.tar.gz"
            & tar -czf $archive -C $stageDirectory 'packata' 'LICENSE' 'README.md'
            if ($LASTEXITCODE -ne 0) { throw "Could not create '$archive'." }
          }

      - name: Smoke-test self-contained archive
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.calculate-version.outputs.semver }}'
          $verifyDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-verify/$rid"
          $extension = '${{ matrix.archive }}'
          $archive = ".artifacts/cli-release/Packata-cli-$version-$rid.$extension"

          if ($extension -eq 'zip') {
            Expand-Archive -LiteralPath $archive -DestinationPath $verifyDirectory
          }
          else {
            & tar -xzf $archive -C $verifyDirectory
            if ($LASTEXITCODE -ne 0) { throw "Could not extract '$archive'." }
          }

          if ($rid.StartsWith('linux-musl-')) {
            $mount = "$((Resolve-Path $verifyDirectory).Path):/work"
            $image = 'mcr.microsoft.com/dotnet/runtime-deps:10.0-alpine'
            $help = @(& docker run --rm --volume $mount --workdir /work $image ./packata --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$rid': $($help -join ' ')" }
            $reportedVersion = @(& docker run --rm --volume $mount --workdir /work $image ./packata --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$rid': $($reportedVersion -join ' ')" }
          }
          else {
            $executable = Join-Path $verifyDirectory '${{ matrix.executable }}'
            $help = @(& $executable --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$rid'." }
            $reportedVersion = @(& $executable --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$rid'." }
          }

          if (($help -join "`n") -notmatch 'USAGE') {
            throw "Packata CLI help output for '$rid' did not contain a usage section."
          }
          if (($reportedVersion -join "`n") -notmatch [regex]::Escape($version)) {
            $actualVersion = $reportedVersion -join ' '
            throw "Packata CLI for '$rid' reported '$actualVersion' instead of '$version'."
          }

      - name: Validate self-contained archive
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -ReleaseDirectory './.artifacts/cli-release'
          -ExpectedRids @('${{ matrix.rid }}')
          -SkipNuGetPackage
          -SkipFrameworkDependentArchives

      - name: Upload self-contained archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-self-contained-${{ matrix.rid }}-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-release
          if-no-files-found: error

  package-python-wheels:
    name: Python · package ${{ matrix.rid }} wheel
    needs: calculate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            platform: win_amd64
            executable: packata.exe
          - runner: ubuntu-22.04
            rid: linux-x64
            platform: manylinux_2_35_x86_64
            executable: packata
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated Python test and packaging dependencies
        run: python -m pip install -e "./python[avro]" setuptools wheel
      - name: Publish private ordinary self-contained host
        run: >-
          dotnet publish src/Packata.Cli/Packata.Cli.csproj -c Release -f net10.0
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false -p:PublishTrimmed=false -p:PublishAot=false -p:PackAsTool=false
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -o .artifacts/python-host
      - name: Test Python client, bounded decoders and local protocol
        shell: pwsh
        run: |
          $env:PACKATA_HOST = (Resolve-Path '.artifacts/python-host/${{ matrix.executable }}').Path
          python -m unittest discover -s python/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python client tests failed.' }
      - name: Test public client against gated live HTTP writers
        shell: pwsh
        run: |
          $env:PACKATA_INTEROP_PYTHON = (Get-Command python).Source
          dotnet test src/Packata.Http.Testing/Packata.Http.Testing.csproj -c Release -f net10.0 --filter 'FullyQualifiedName~PythonReadersConsumeLiveResponsesIncrementally' --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Live Python interoperability failed.' }
      - name: Build and validate platform wheel and record size
        shell: pwsh
        run: |
          python python/build_wheel.py --version '${{ needs.calculate-version.outputs.semver }}' --host .artifacts/python-host --platform '${{ matrix.platform }}' --assets src/Packata.Cli/obj/project.assets.json --output .artifacts/python-release
          if ($LASTEXITCODE -ne 0) { throw 'Wheel packaging failed.' }
          Get-ChildItem .artifacts/python-release/*.whl | ForEach-Object { "$($_.Name): $($_.Length) bytes" >> $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.rid }}-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/python-release/*.whl
          if-no-files-found: error

  test-python-wheels:
    name: Python · installed wheel · ${{ matrix.rid }} · ${{ matrix.python }}
    needs: [calculate-version, package-python-wheels]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: linux-x64
            runner: ubuntu-22.04
        rid: [win-x64, linux-x64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: python-wheel-${{ matrix.rid }}-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/python-release
      - name: Install actual wheel and optional test codec
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem .artifacts/python-release/*.whl)
          if ($wheel.Count -ne 1) { throw 'Expected exactly one platform wheel.' }
          python -m pip install $wheel[0].FullName fastavro
          if ($LASTEXITCODE -ne 0) { throw 'Wheel installation failed.' }
      - name: Smoke bundled host without a separate runtime or CLI
        run: python python/smoke_wheel.py
      - name: Run focused tests against installed wheel
        run: python -m unittest discover -s python/tests -v

  validate-release-artifacts:
    name: Artifacts · validate complete release set
    needs:
      - calculate-version
      - package-libraries
      - package-cli-nuget
      - test-cli-nuget
      - test-cli-sdk-compatibility
      - package-cli-framework-archives
      - package-cli-self-contained-archives
      - build-package-language-support
      - test-python-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packaged library NuGet artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/libraries

      - name: Download packaged CLI NuGet artifact
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/cli

      - name: Download packaged schema artifact
        if: needs.package-libraries.outputs.has-release-asset == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release

      - name: Download packaged CLI framework-dependent archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-framework-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Download packaged CLI self-contained archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-self-contained-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Download packaged Python wheels
        uses: actions/download-artifact@v7
        with:
          pattern: python-wheel-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Validate complete Python wheel set
        run: python3 python/validate_wheels.py --directory .artifacts/release --version '${{ needs.calculate-version.outputs.semver }}'

      - name: Download packaged VSIX artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: vscode-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Validate library, schema, and CLI artifacts
        shell: pwsh
        run: |
          ./.github/scripts/Validate-ReleaseArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/libraries' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-CliArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/cli' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-VsixArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -Directory './.artifacts/release'

  verify-release-identity:
    name: Release identity · revalidate version and reserve tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - calculate-version
      - validate-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested commit with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh remote tags
        run: git fetch origin --force --tags

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.6.0

      - name: Recalculate version after artifact validation
        id: release-version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Verify tested commit and release version
        shell: pwsh
        run: |
          $testedCommit = git rev-parse HEAD
          if ($testedCommit -ne '${{ github.sha }}') {
            throw "Checked-out commit '$testedCommit' does not match tested commit '${{ github.sha }}'."
          }

          $packagedVersion = '${{ needs.calculate-version.outputs.semver }}'
          $releaseVersion = '${{ steps.release-version.outputs.semVer }}'.ToLowerInvariant()
          if ($releaseVersion -ne $packagedVersion) {
            throw "Release version '$releaseVersion' does not match packaged version '$packagedVersion'."
          }

      - name: Reserve release tag for patch-zero releases
        if: needs.calculate-version.outputs.patch == '0'
        shell: pwsh
        run: |
          $tag = 'v${{ needs.calculate-version.outputs.semver }}'
          $remote = git ls-remote --tags origin "refs/tags/$tag"

          if ($remote) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne '${{ github.sha }}') {
              throw "Tag '$tag' already identifies '$tagCommit', not '${{ github.sha }}'."
            }
            Write-Host "Reusing '$tag' for the tested commit."
          }
          else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate $tag --message "Packata ${{ needs.calculate-version.outputs.semver }}" '${{ github.sha }}'
            git push origin $tag
          }

  publish-nuget:
    name: Publishing · push library and CLI packages to NuGet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - calculate-version
      - validate-release-artifacts
      - verify-release-identity
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out artifact validators
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Download validated library NuGet artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/libraries

      - name: Download validated CLI NuGet artifact
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/cli

      - name: Revalidate NuGet artifacts before publishing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force './.artifacts/release' | Out-Null
          ./.github/scripts/Validate-ReleaseArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/libraries' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-CliArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/cli' `
            -SkipFrameworkDependentArchives `
            -SkipSelfContainedArchives

      - name: Exchange GitHub identity for a NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Seddryck

      - name: Publish packages to NuGet
        shell: pwsh
        run: |
          $pointerPackage = 'Packata-cli.${{ needs.calculate-version.outputs.semver }}.nupkg'
          $packages = @(
            Get-ChildItem .artifacts/nuget -Filter *.nupkg -File -Recurse |
              Sort-Object @{ Expression = { if ($_.Name -eq $pointerPackage) { 1 } else { 0 } } }, Name
          )

          $packages | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              throw "Publishing '$($_.Name)' failed."
            }
          }

  publish-github-release:
    name: Publishing · create GitHub release and upload CLI assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.calculate-version.outputs.patch == '0'
    needs:
      - calculate-version
      - package-libraries
      - validate-release-artifacts
      - verify-release-identity
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Check out artifact validators
        uses: actions/checkout@v7

      - name: Download validated library NuGet artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/libraries

      - name: Download validated CLI NuGet artifact
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/cli

      - name: Download validated schema artifact
        if: needs.package-libraries.outputs.has-release-asset == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release

      - name: Download validated CLI framework-dependent archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-framework-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Download validated CLI self-contained archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-self-contained-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Download validated Python wheels for GitHub Release only
        uses: actions/download-artifact@v7
        with:
          pattern: python-wheel-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Revalidate Python wheels before GitHub Release upload
        run: python3 python/validate_wheels.py --directory .artifacts/release --version '${{ needs.calculate-version.outputs.semver }}'

      - name: Download validated VSIX artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: vscode-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Revalidate release assets before publishing
        shell: pwsh
        run: |
          ./.github/scripts/Validate-ReleaseArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/libraries' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-CliArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/cli' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-VsixArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -Directory './.artifacts/release'

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ needs.calculate-version.outputs.semver }}'
          $assets = @(Get-ChildItem '.artifacts/release' -File | Select-Object -ExpandProperty FullName)

          if (gh release view $tag 2>$null) {
            if ($assets.Count -gt 0) {
              gh release upload $tag @assets --clobber
            }
          }
          else {
            $arguments = @(
              'release', 'create', $tag,
              '--title', 'Packata ${{ needs.calculate-version.outputs.semver }}',
              '--generate-notes',
              '--discussion-category', 'Announcements',
              '--verify-tag'
            )
            if ($assets.Count -gt 0) {
              $arguments += $assets
            }
            gh @arguments
          }
