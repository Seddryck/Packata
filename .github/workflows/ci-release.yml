name: Build, package, and publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_NO_WORKLOAD_UPDATE_NOTIFICATION: 1

jobs:
  calculate-version:
    name: Version · calculate and validate
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      patch: ${{ steps.gitversion.outputs.patch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.6.0

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ steps.gitversion.outputs.semVer }}'
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "GitVersion produced invalid SemVer '$version'."
          }

  build-test-libraries:
    name: Libraries · build and test
    needs: calculate-version
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401

      - name: Restore libraries
        run: dotnet restore Packata.Libraries.slnf

      - name: Build libraries
        run: >-
          dotnet build Packata.Libraries.slnf
          --configuration Release
          --no-restore
          --nologo
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Test supported frameworks
        shell: pwsh
        run: |
          $projects = @(
            'Packata.Core',
            'Packata.DataPackage',
            'Packata.ResourceReaders',
            'Packata.Provisioners',
            'Packata.Storages',
            'Packata.OpenDataContract'
          )
          $frameworks = @('net8.0', 'net9.0', 'net10.0')
          $thresholdProjects = @('Packata.Core', 'Packata.ResourceReaders', 'Packata.Provisioners')

          New-Item -ItemType Directory -Force .coverage, .test-results | Out-Null

          foreach ($project in $projects) {
            foreach ($framework in $frameworks) {
              $testProject = "src/$project.Testing/$project.Testing.csproj"
              $coverage = "$pwd/.coverage/coverage.$project.$framework.xml"
              $results = "$pwd/.test-results/$project/$framework"
              $arguments = @(
                'test', $testProject,
                '--configuration', 'Release',
                '--framework', $framework,
                '--no-build',
                '--no-restore',
                '--nologo',
                '--logger', 'trx',
                '--results-directory', $results,
                '-p:CollectCoverage=true',
                '-p:CoverletOutputFormat=opencover',
                '-p:Exclude=[Packata.*.Testing]*',
                "-p:CoverletOutput=$coverage"
              )

              if ($project -in $thresholdProjects) {
                $arguments += '-p:Threshold=10', '-p:ThresholdType=line'
              }

              & dotnet @arguments
              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed for $project on $framework."
              }
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ needs.calculate-version.outputs.semver }}
          path: .test-results
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: .coverage
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload compiled library outputs for packaging
        uses: actions/upload-artifact@v7
        with:
          name: library-build-${{ needs.calculate-version.outputs.semver }}
          path: |
            src/Packata.Core/bin/Release
            src/Packata.Core/obj
            src/Packata.DataPackage/bin/Release
            src/Packata.DataPackage/obj
            src/Packata.OpenDataContract/bin/Release
            src/Packata.OpenDataContract/obj
            src/Packata.Provisioners/bin/Release
            src/Packata.Provisioners/obj
            src/Packata.ResourceReaders/bin/Release
            src/Packata.ResourceReaders/obj
            src/Packata.ResourceReaders.Database/bin/Release
            src/Packata.ResourceReaders.Database/obj
            src/Packata.ResourceReaders.Excel/bin/Release
            src/Packata.ResourceReaders.Excel/obj
            src/Packata.ResourceReaders.FixedWidth/bin/Release
            src/Packata.ResourceReaders.FixedWidth/obj
            src/Packata.ResourceReaders.KeyValue/bin/Release
            src/Packata.ResourceReaders.KeyValue/obj
            src/Packata.ResourceReaders.Ndjson/bin/Release
            src/Packata.ResourceReaders.Ndjson/obj
            src/Packata.ResourceReaders.Parquet/bin/Release
            src/Packata.ResourceReaders.Parquet/obj
            src/Packata.ResourceReaders.WebLogs/bin/Release
            src/Packata.ResourceReaders.WebLogs/obj
            src/Packata.Storages/bin/Release
            src/Packata.Storages/obj
          if-no-files-found: error

  package-libraries:
    name: Libraries · package NuGet and schema artifacts
    needs:
      - calculate-version
      - build-test-libraries
    runs-on: windows-latest
    outputs:
      has-release-asset: ${{ steps.schema.outputs.has-release-asset }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401

      - name: Restore library package dependencies
        run: dotnet restore Packata.Libraries.slnf

      - name: Download compiled library outputs
        uses: actions/download-artifact@v7
        with:
          name: library-build-${{ needs.calculate-version.outputs.semver }}
          path: src

      - name: Install schema generator
        run: dotnet tool install --global Schemathief-cli --version 0.3.0

      - name: Generate schema release asset
        id: schema
        shell: pwsh
        run: |
          ./package-delta-schemas.ps1 -Version '${{ needs.calculate-version.outputs.semver }}' -OutputDirectory './.artifacts/release'
          $archive = Test-Path -LiteralPath './.artifacts/release/schemas-${{ needs.calculate-version.outputs.semver }}.zip' -PathType Leaf
          "has-release-asset=$($archive.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Package library NuGet artifacts
        shell: pwsh
        run: |
          $projects = @(
            'Packata.Core',
            'Packata.DataPackage',
            'Packata.ResourceReaders',
            'Packata.ResourceReaders.Database',
            'Packata.ResourceReaders.Excel',
            'Packata.ResourceReaders.FixedWidth',
            'Packata.ResourceReaders.KeyValue',
            'Packata.ResourceReaders.Ndjson',
            'Packata.ResourceReaders.Parquet',
            'Packata.ResourceReaders.WebLogs',
            'Packata.Provisioners',
            'Packata.Storages',
            'Packata.OpenDataContract'
          )

          foreach ($project in $projects) {
            dotnet pack "src/$project/$project.csproj" `
              --configuration Release `
              --no-build `
              --no-restore `
              --nologo `
              --include-symbols `
              --output .artifacts/nuget `
              -p:Version='${{ needs.calculate-version.outputs.semver }}'

            if ($LASTEXITCODE -ne 0) {
              throw "Packing failed for $project."
            }
          }

      - name: Validate release artifacts
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-ReleaseArtifacts.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -NuGetDirectory './.artifacts/nuget'
          -ReleaseDirectory './.artifacts/release'

      - name: Upload packaged library artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload packaged schema artifact
        if: steps.schema.outputs.has-release-asset == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          include-hidden-files: true
          if-no-files-found: error

  build-test-cli:
    name: CLI · build and test
    needs: calculate-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401

      - name: Restore CLI tests
        run: dotnet restore src/Packata.Cli.Testing/Packata.Cli.Testing.csproj

      - name: Build CLI tests
        run: >-
          dotnet build src/Packata.Cli.Testing/Packata.Cli.Testing.csproj
          --configuration Release
          --no-restore
          --nologo
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Run CLI tests
        shell: pwsh
        run: |
          foreach ($framework in @('net8.0', 'net9.0', 'net10.0')) {
            dotnet test src/Packata.Cli.Testing/Packata.Cli.Testing.csproj `
              --configuration Release `
              --framework $framework `
              --no-build `
              --no-restore `
              --nologo

            if ($LASTEXITCODE -ne 0) {
              throw "CLI tests failed on $framework."
            }
          }

  package-cli-nuget:
    name: CLI · package NuGet tool
    needs:
      - calculate-version
      - build-test-cli
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore CLI package dependencies
        run: dotnet restore src/Packata.Cli/Packata.Cli.csproj

      - name: Package CLI pointer and RID-specific tools
        run: >-
          dotnet pack src/Packata.Cli/Packata.Cli.csproj
          --configuration Release
          --no-restore
          --nologo
          --output .artifacts/cli-nuget
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true

      - name: Validate CLI tool package
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -NuGetDirectory './.artifacts/cli-nuget'
          -SkipFrameworkDependentArchives
          -SkipSelfContainedArchives

      - name: Upload CLI tool package
        uses: actions/upload-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-nuget
          if-no-files-found: error

  package-cli-framework-archives:
    name: CLI · package framework archive (${{ matrix.framework.tfm }}, ${{ matrix.target.rid }})
    needs:
      - calculate-version
      - build-test-cli
    strategy:
      fail-fast: false
      matrix:
        framework:
          - tfm: net8.0
            runtime: '8.0'
          - tfm: net9.0
            runtime: '9.0'
          - tfm: net10.0
            runtime: '10.0'
        target:
          - rid: win-x64
            runner: windows-latest
            archive: zip
            executable: packata.exe
          - rid: win-arm64
            runner: windows-11-arm
            archive: zip
            executable: packata.exe
          - rid: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: linux-musl-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: osx-x64
            runner: macos-15-intel
            archive: tar.gz
            executable: packata
          - rid: osx-arm64
            runner: macos-15
            archive: tar.gz
            executable: packata
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.416
            9.0.308
            10.0.401

      - name: Restore framework-dependent CLI runtime
        run: >-
          dotnet restore src/Packata.Cli/Packata.Cli.csproj
          --runtime ${{ matrix.target.rid }}
          -p:TargetFrameworks=${{ matrix.framework.tfm }}
          -p:SelfContained=false

      - name: Build framework-dependent CLI payload
        run: >-
          dotnet publish src/Packata.Cli/Packata.Cli.csproj
          --configuration Release
          --framework ${{ matrix.framework.tfm }}
          --runtime ${{ matrix.target.rid }}
          --self-contained false
          --no-restore
          --nologo
          --output .artifacts/cli-publish/${{ matrix.framework.tfm }}/${{ matrix.target.rid }}
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:PublishAot=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create framework-dependent archive
        shell: pwsh
        run: |
          $framework = '${{ matrix.framework.tfm }}'
          $rid = '${{ matrix.target.rid }}'
          $version = '${{ needs.calculate-version.outputs.semver }}'
          $publishDirectory = Resolve-Path ".artifacts/cli-publish/$framework/$rid"
          $stageDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-stage/$framework/$rid"
          $releaseDirectory = New-Item -ItemType Directory -Force '.artifacts/cli-release'

          Copy-Item (Join-Path $publishDirectory '*') $stageDirectory -Recurse
          Copy-Item './LICENSE' $stageDirectory
          Copy-Item './README.md' $stageDirectory

          if ('${{ matrix.target.archive }}' -eq 'zip') {
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$framework-$rid.zip"
            Compress-Archive -Path (Join-Path $stageDirectory '*') -DestinationPath $archive -CompressionLevel Optimal
          }
          else {
            $executable = Join-Path $stageDirectory 'packata'
            & chmod +x $executable
            if ($LASTEXITCODE -ne 0) { throw "Could not mark '$executable' as executable." }
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$framework-$rid.tar.gz"
            & tar -czf $archive -C $stageDirectory .
            if ($LASTEXITCODE -ne 0) { throw "Could not create '$archive'." }
          }

      - name: Smoke-test framework-dependent archive
        shell: pwsh
        run: |
          $framework = '${{ matrix.framework.tfm }}'
          $rid = '${{ matrix.target.rid }}'
          $version = '${{ needs.calculate-version.outputs.semver }}'
          $verifyDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-verify/$framework/$rid"
          $extension = '${{ matrix.target.archive }}'
          $archive = ".artifacts/cli-release/Packata-cli-$version-$framework-$rid.$extension"

          if ($extension -eq 'zip') {
            Expand-Archive -LiteralPath $archive -DestinationPath $verifyDirectory
          }
          else {
            & tar -xzf $archive -C $verifyDirectory
            if ($LASTEXITCODE -ne 0) { throw "Could not extract '$archive'." }
          }

          if ($rid.StartsWith('linux-musl-')) {
            $mount = "$((Resolve-Path $verifyDirectory).Path):/work"
            $image = 'mcr.microsoft.com/dotnet/runtime:${{ matrix.framework.runtime }}-alpine'
            $help = @(& docker run --rm --volume $mount --workdir /work $image ./packata --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$framework/$rid': $($help -join ' ')" }
            $reportedVersion = @(& docker run --rm --volume $mount --workdir /work $image ./packata --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$framework/$rid': $($reportedVersion -join ' ')" }
          }
          else {
            $executable = Join-Path $verifyDirectory '${{ matrix.target.executable }}'
            $help = @(& $executable --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$framework/$rid'." }
            $reportedVersion = @(& $executable --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$framework/$rid'." }
          }

          if (($help -join "`n") -notmatch 'USAGE') {
            throw "Packata CLI help output for '$framework/$rid' did not contain a usage section."
          }
          if (($reportedVersion -join "`n") -notmatch [regex]::Escape($version)) {
            $actualVersion = $reportedVersion -join ' '
            throw "Packata CLI for '$framework/$rid' reported '$actualVersion' instead of '$version'."
          }

      - name: Validate framework-dependent archive
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -ReleaseDirectory './.artifacts/cli-release'
          -ExpectedFrameworks @('${{ matrix.framework.tfm }}')
          -ExpectedRids @('${{ matrix.target.rid }}')
          -SkipNuGetPackage
          -SkipSelfContainedArchives

      - name: Upload framework-dependent archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-framework-${{ matrix.framework.tfm }}-${{ matrix.target.rid }}-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-release
          if-no-files-found: error

  package-cli-self-contained-archives:
    name: CLI · package self-contained archive (net10.0, ${{ matrix.rid }})
    needs:
      - calculate-version
      - build-test-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            archive: zip
            executable: packata.exe
          - rid: win-arm64
            runner: windows-11-arm
            archive: zip
            executable: packata.exe
          - rid: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: linux-musl-x64
            runner: ubuntu-latest
            archive: tar.gz
            executable: packata
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            executable: packata
          - rid: osx-x64
            runner: macos-15-intel
            archive: tar.gz
            executable: packata
          - rid: osx-arm64
            runner: macos-15
            archive: tar.gz
            executable: packata
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore self-contained CLI runtime
        run: >-
          dotnet restore src/Packata.Cli/Packata.Cli.csproj
          --runtime ${{ matrix.rid }}
          -p:TargetFrameworks=net10.0
          -p:SelfContained=true

      - name: Build self-contained CLI payload
        run: >-
          dotnet publish src/Packata.Cli/Packata.Cli.csproj
          --configuration Release
          --framework net10.0
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --nologo
          --output .artifacts/cli-publish/${{ matrix.rid }}
          -p:Version=${{ needs.calculate-version.outputs.semver }}
          -p:ContinuousIntegrationBuild=true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:PublishAot=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create self-contained archive
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.calculate-version.outputs.semver }}'
          $publishDirectory = Resolve-Path ".artifacts/cli-publish/$rid"
          $stageDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-stage/$rid"
          $releaseDirectory = New-Item -ItemType Directory -Force '.artifacts/cli-release'

          Copy-Item (Join-Path $publishDirectory '${{ matrix.executable }}') $stageDirectory
          Copy-Item './LICENSE' $stageDirectory
          Copy-Item './README.md' $stageDirectory

          if ('${{ matrix.archive }}' -eq 'zip') {
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$rid.zip"
            Compress-Archive -Path (Join-Path $stageDirectory '*') -DestinationPath $archive -CompressionLevel Optimal
          }
          else {
            $executable = Join-Path $stageDirectory 'packata'
            & chmod +x $executable
            if ($LASTEXITCODE -ne 0) { throw "Could not mark '$executable' as executable." }
            $archive = Join-Path $releaseDirectory "Packata-cli-$version-$rid.tar.gz"
            & tar -czf $archive -C $stageDirectory 'packata' 'LICENSE' 'README.md'
            if ($LASTEXITCODE -ne 0) { throw "Could not create '$archive'." }
          }

      - name: Smoke-test self-contained archive
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $version = '${{ needs.calculate-version.outputs.semver }}'
          $verifyDirectory = New-Item -ItemType Directory -Force ".artifacts/cli-verify/$rid"
          $extension = '${{ matrix.archive }}'
          $archive = ".artifacts/cli-release/Packata-cli-$version-$rid.$extension"

          if ($extension -eq 'zip') {
            Expand-Archive -LiteralPath $archive -DestinationPath $verifyDirectory
          }
          else {
            & tar -xzf $archive -C $verifyDirectory
            if ($LASTEXITCODE -ne 0) { throw "Could not extract '$archive'." }
          }

          if ($rid.StartsWith('linux-musl-')) {
            $mount = "$((Resolve-Path $verifyDirectory).Path):/work"
            $image = 'mcr.microsoft.com/dotnet/runtime-deps:10.0-alpine'
            $help = @(& docker run --rm --volume $mount --workdir /work $image ./packata --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$rid': $($help -join ' ')" }
            $reportedVersion = @(& docker run --rm --volume $mount --workdir /work $image ./packata --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$rid': $($reportedVersion -join ' ')" }
          }
          else {
            $executable = Join-Path $verifyDirectory '${{ matrix.executable }}'
            $help = @(& $executable --help 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI help smoke test failed for '$rid'." }
            $reportedVersion = @(& $executable --version 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "Packata CLI version smoke test failed for '$rid'." }
          }

          if (($help -join "`n") -notmatch 'USAGE') {
            throw "Packata CLI help output for '$rid' did not contain a usage section."
          }
          if (($reportedVersion -join "`n") -notmatch [regex]::Escape($version)) {
            $actualVersion = $reportedVersion -join ' '
            throw "Packata CLI for '$rid' reported '$actualVersion' instead of '$version'."
          }

      - name: Validate self-contained archive
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-CliArtifacts.ps1
          -Version '${{ needs.calculate-version.outputs.semver }}'
          -ReleaseDirectory './.artifacts/cli-release'
          -ExpectedRids @('${{ matrix.rid }}')
          -SkipNuGetPackage
          -SkipFrameworkDependentArchives

      - name: Upload self-contained archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-self-contained-${{ matrix.rid }}-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/cli-release
          if-no-files-found: error

  validate-release-artifacts:
    name: Artifacts · validate complete release set
    needs:
      - calculate-version
      - package-libraries
      - package-cli-nuget
      - package-cli-framework-archives
      - package-cli-self-contained-archives
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packaged library NuGet artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/libraries

      - name: Download packaged CLI NuGet artifact
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/cli

      - name: Download packaged schema artifact
        if: needs.package-libraries.outputs.has-release-asset == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release

      - name: Download packaged CLI framework-dependent archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-framework-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Download packaged CLI self-contained archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-self-contained-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Validate library, schema, and CLI artifacts
        shell: pwsh
        run: |
          ./.github/scripts/Validate-ReleaseArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/libraries' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-CliArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/cli' `
            -ReleaseDirectory './.artifacts/release'

  verify-release-identity:
    name: Release identity · revalidate version and reserve tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - calculate-version
      - validate-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested commit with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh remote tags
        run: git fetch origin --force --tags

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.6.0

      - name: Recalculate version after artifact validation
        id: release-version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Verify tested commit and release version
        shell: pwsh
        run: |
          $testedCommit = git rev-parse HEAD
          if ($testedCommit -ne '${{ github.sha }}') {
            throw "Checked-out commit '$testedCommit' does not match tested commit '${{ github.sha }}'."
          }

          $packagedVersion = '${{ needs.calculate-version.outputs.semver }}'
          $releaseVersion = '${{ steps.release-version.outputs.semVer }}'
          if ($releaseVersion -ne $packagedVersion) {
            throw "Release version '$releaseVersion' does not match packaged version '$packagedVersion'."
          }

      - name: Reserve release tag for patch-zero releases
        if: needs.calculate-version.outputs.patch == '0'
        shell: pwsh
        run: |
          $tag = 'v${{ needs.calculate-version.outputs.semver }}'
          $remote = git ls-remote --tags origin "refs/tags/$tag"

          if ($remote) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne '${{ github.sha }}') {
              throw "Tag '$tag' already identifies '$tagCommit', not '${{ github.sha }}'."
            }
            Write-Host "Reusing '$tag' for the tested commit."
          }
          else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate $tag --message "Packata ${{ needs.calculate-version.outputs.semver }}" '${{ github.sha }}'
            git push origin $tag
          }

  publish-nuget:
    name: Publishing · push library and CLI packages to NuGet
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - calculate-version
      - validate-release-artifacts
      - verify-release-identity
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out artifact validators
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Download validated library NuGet artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/libraries

      - name: Download validated CLI NuGet artifact
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/cli

      - name: Revalidate NuGet artifacts before publishing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force './.artifacts/release' | Out-Null
          ./.github/scripts/Validate-ReleaseArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/libraries' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-CliArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/cli' `
            -SkipFrameworkDependentArchives `
            -SkipSelfContainedArchives

      - name: Exchange GitHub identity for a NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Seddryck

      - name: Publish packages to NuGet
        shell: pwsh
        run: |
          $pointerPackage = 'Packata-cli.${{ needs.calculate-version.outputs.semver }}.nupkg'
          $packages = @(
            Get-ChildItem .artifacts/nuget -Filter *.nupkg -File -Recurse |
              Sort-Object @{ Expression = { if ($_.Name -eq $pointerPackage) { 1 } else { 0 } } }, Name
          )

          $packages | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              throw "Publishing '$($_.Name)' failed."
            }
          }

  publish-github-release:
    name: Publishing · create GitHub release and upload CLI assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.calculate-version.outputs.patch == '0'
    needs:
      - calculate-version
      - package-libraries
      - validate-release-artifacts
      - verify-release-identity
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Check out artifact validators
        uses: actions/checkout@v7

      - name: Download validated library NuGet artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/libraries

      - name: Download validated CLI NuGet artifact
        uses: actions/download-artifact@v7
        with:
          name: cli-tool-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/nuget/cli

      - name: Download validated schema artifact
        if: needs.package-libraries.outputs.has-release-asset == 'true'
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release

      - name: Download validated CLI framework-dependent archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-framework-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Download validated CLI self-contained archives
        uses: actions/download-artifact@v7
        with:
          pattern: cli-self-contained-*-${{ needs.calculate-version.outputs.semver }}
          path: .artifacts/release
          merge-multiple: true

      - name: Revalidate release assets before publishing
        shell: pwsh
        run: |
          ./.github/scripts/Validate-ReleaseArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/libraries' `
            -ReleaseDirectory './.artifacts/release'

          ./.github/scripts/Validate-CliArtifacts.ps1 `
            -Version '${{ needs.calculate-version.outputs.semver }}' `
            -NuGetDirectory './.artifacts/nuget/cli' `
            -ReleaseDirectory './.artifacts/release'

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ needs.calculate-version.outputs.semver }}'
          $assets = @(Get-ChildItem '.artifacts/release' -File | Select-Object -ExpandProperty FullName)

          if (gh release view $tag 2>$null) {
            if ($assets.Count -gt 0) {
              gh release upload $tag @assets --clobber
            }
          }
          else {
            $arguments = @(
              'release', 'create', $tag,
              '--title', 'Packata ${{ needs.calculate-version.outputs.semver }}',
              '--generate-notes',
              '--discussion-category', 'Announcements',
              '--verify-tag'
            )
            if ($assets.Count -gt 0) {
              $arguments += $assets
            }
            gh @arguments
          }
