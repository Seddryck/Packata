[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packata"
version = "0.0.0"
description = "Incremental local and HTTP clients for Packata contracts"
requires-python = ">=3.10,<3.15"
dependencies = ["pyarrow>=18,<24", "tzdata>=2024.1; sys_platform == 'win32'"]
license = "Apache-2.0"

[project.optional-dependencies]
avro = ["fastavro>=1.9,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
packata = ["_host/**/*"]
